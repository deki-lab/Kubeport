version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A single weekly PR for all github-actions updates.
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # A single weekly PR for all cargo updates.
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: chore

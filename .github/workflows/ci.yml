name: CI

on:
  pull_request:
    # `closed` only cancels the run still in progress (see concurrency); every job skips it.
    # No `paths:` filter here: the `changes` job decides, so a skipped job still
    # reports a status that satisfies a required check.
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

# One run per PR: a new push, a merge or a close cancels the run in progress.
# Pushes to main are grouped by commit, so each main commit is still tested.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lists the files changed by the PR (or the push) and says which jobs they affect.
  # Docs-only changes (README, docs/, CHANGELOG...) run neither job.
  #   rust, app    quick checks, on every PR and push that touches their files
  #   full         Intel tests and the shipped (release, universal) build: on main, and on
  #                the release PR, which is then blocked until the release would build
  changes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      app: ${{ steps.filter.outputs.app }}
      full: ${{ steps.filter.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # The release PR (opened by release-please) only bumps the version: it runs the
          # full builds whatever it changes.
          if [[ "$HEAD_REF" == release-please--* ]]; then
            echo "full=release" >> "$GITHUB_OUTPUT"
          fi
          # No usable base (first push of a branch, rewritten history): run everything.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "app=true" >> "$GITHUB_OUTPUT"
            [[ "$EVENT" == push ]] && echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$BASE...$HEAD")"
          printf '%s\n' "$files"
          affects() { printf '%s\n' "$files" | grep -Eq "$1" && echo true || echo false; }
          # This workflow is in the list, so a change to it runs the jobs it tests.
          shared='^(Cargo\.toml|Cargo\.lock|rust-toolchain(\.toml)?|\.cargo/|\.github/workflows/ci\.yml$)'
          echo "rust=$(affects "$shared|^(core|cli|ffi)/")" >> "$GITHUB_OUTPUT"
          # version.txt only names the release DMG: a release PR builds nothing.
          app="$(affects "$shared|^(core|ffi|app|scripts)/")"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" == push && "$app" == true ]]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # The core is cross-platform: Linux starts fast and costs 10x less than macOS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Compiled dependencies; saved from main only, restored everywhere.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # Compiled dependencies; saved from main only, restored everywhere.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Quick: dev profile (no LTO), this Mac's architecture, no DMG. swift test builds
      # the whole app. The shipped build is checked by app-release.
      - run: python3 -I scripts/check-l10n.py
      - run: ./scripts/build-ffi.sh
        env:
          PROFILE: dev
      - run: swift test --package-path app

  # The release DMG is universal: run the core and the app tests natively on Intel,
  # which executes the x86_64 slice (Swift tests call the Rust core through the FFI).
  app-intel:
    needs: changes
    if: needs.changes.outputs.full != ''
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # Compiled dependencies; saved from main only, restored everywhere.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --all
      # Dev profile: no LTO (minutes on Intel runners); app-release builds the release profile.
      - run: ./scripts/build-ffi.sh
        env:
          ARCHS: x86_64
          PROFILE: dev
      - run: swift test --package-path app

  # The build that ships: release profile (LTO), arm64 + x86_64, DMG. The release
  # workflow runs the same script; this job finds a broken one before the release PR merges.
  app-release:
    needs: changes
    if: needs.changes.outputs.full != ''
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # Compiled dependencies; saved from main only, restored everywhere.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ./scripts/build-app.sh

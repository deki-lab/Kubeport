name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    # The core is cross-platform: Linux starts fast and costs 10x less than macOS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  app:
    # Never run fork code on a personal machine.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    # Self-hosted runners (maintainer's Mac) while the repo is private: GitHub cancels
    # macos-15 arm64 jobs for lack of capacity. Switch back to `macos-15` before going public.
    runs-on: [self-hosted, macOS, ARM64, kubeport]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        # On the maintainer's Mac, keep their rustup as is.
        if: runner.environment == 'github-hosted'
        with:
          toolchain: stable
      - run: ./scripts/build-app.sh

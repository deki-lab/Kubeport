name: CI

on:
  pull_request:
    # `closed` only cancels the run still in progress (see concurrency); every job skips it.
    # No `paths:` filter here: the `changes` job decides, so a skipped job still
    # reports a status that satisfies a required check.
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

# One run per PR: a new push, a merge or a close cancels the run in progress.
# Pushes to main are grouped by commit, so each main commit is still tested.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lists the files changed by the PR (or the push) and says which jobs they affect.
  #   rust      on every PR and push that touches the Rust code (Linux, quick)
  #   swift     on every PR and push that touches the app's Swift code: swift-format (Linux)
  #   release   the release PR only: the app tests on macOS (Apple silicon and Intel),
  #             each job waiting for an approval in the release-build environment.
  #             Until they pass, the release PR cannot merge.
  # The app is not built on other PRs or on main; the DMG is built once, by the release.
  changes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      swift: ${{ steps.filter.outputs.swift }}
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # The release PR (opened by release-please) runs the macOS builds whatever it changes.
          if [[ "$HEAD_REF" == release-please--* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          # No usable base (first push of a branch, rewritten history): run the Rust checks.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "swift=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$BASE...$HEAD")"
          printf '%s\n' "$files"
          affects() { printf '%s\n' "$files" | grep -Eq "$1" && echo true || echo false; }
          # This workflow is in the list, so a change to it runs the jobs it tests.
          shared='^(Cargo\.toml|Cargo\.lock|rust-toolchain(\.toml)?|\.cargo/|\.github/workflows/ci\.yml$)'
          echo "rust=$(affects "$shared|^(core|cli|ffi)/")" >> "$GITHUB_OUTPUT"
          echo "swift=$(affects '^(app/.*\.swift|\.swift-format|\.github/workflows/ci\.yml)$')" >> "$GITHUB_OUTPUT"

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # The core is cross-platform: Linux starts fast and costs 10x less than macOS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Compiled dependencies; saved from main only, restored everywhere.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  # Style of the app's Swift code, with the swift-format of the Swift toolchain (.swift-format).
  # A linter, not a build: type errors only show in the app tests on the release PR.
  swift-format:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift --version
      - run: git ls-files -z 'app/*.swift' | xargs -0 swift format lint --strict

  # The release DMG is universal: run the core and the app tests natively on Intel,
  # which executes the x86_64 slice (Swift tests call the Rust core through the FFI).
  # Waits for an approval: "Review deployments" on the release PR's checks.
  app-intel:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    environment: release-build
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo test --all
      # Dev profile: no LTO (minutes on Intel runners); the release builds the release profile.
      - run: ./scripts/build-ffi.sh
        env:
          ARCHS: x86_64
          PROFILE: dev
      - run: swift test --package-path app

  # The app tests on Apple silicon: dev profile, no DMG (the release builds it once, after
  # the merge). Waits for an approval, like app-intel.
  app-tests:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    environment: release-build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: python3 -I scripts/check-l10n.py
      - run: ./scripts/build-ffi.sh
        env:
          PROFILE: dev
      - run: swift test --package-path app

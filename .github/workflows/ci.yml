name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    # Le cœur est multiplateforme : Linux démarre vite et coûte 10x moins que macOS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  app:
    # Jamais de code de fork sur une machine perso.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    # Runners auto-hébergés (Mac du mainteneur) tant que le dépôt est privé : GitHub annule
    # les jobs macos-15 arm64 faute de capacité. Revenir à `macos-15` avant le passage en public.
    runs-on: [self-hosted, macOS, ARM64, kubeport]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        # Sur le Mac du mainteneur, on garde son rustup tel quel.
        if: runner.environment == 'github-hosted'
        with:
          toolchain: stable
      - run: ./scripts/build-app.sh

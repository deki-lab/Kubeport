name: release-please

on:
  push:
    branches: [main]

# Each job gets only what it needs: the job that compiles third-party crates holds no
# write token.
permissions: {}

jobs:
  # Writes with a token of the deki-lab-release-please GitHub App (Contents, Pull requests
  # and Issues: read and write; installed on Kubeport only): repo variable
  # RELEASE_PLEASE_CLIENT_ID, repo secret RELEASE_PLEASE_APP_KEY. A PR opened with the
  # GITHUB_TOKEN starts no workflow, so the release PR would have no checks.
  release-please:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-dmg:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.dmg.outputs.sha256 }}
      dmg: ${{ steps.dmg.outputs.dmg }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      # Installs the version pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - id: dmg
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid tag: $TAG" >&2; exit 1; }
          DMG="$(./scripts/build-app.sh | tail -1)"
          echo "sha256=$(shasum -a 256 "$DMG" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "dmg=$(basename "$DMG")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 1

  # Uploads the DMG to the release; runs no build code.
  upload-dmg:
    needs: [release-please, build-dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmg
          path: dmg
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          DMG: ${{ needs.build-dmg.outputs.dmg }}
          SHA256: ${{ needs.build-dmg.outputs.sha256 }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid tag: $TAG" >&2; exit 1; }
          [[ "$DMG" =~ ^Kubeport-[0-9]+\.[0-9]+\.[0-9]+\.dmg$ ]] || { echo "invalid name: $DMG" >&2; exit 1; }
          echo "$SHA256  dmg/$DMG" | sha256sum --check --strict
          gh release upload "$TAG" "dmg/$DMG" --clobber --repo "$GITHUB_REPOSITORY"

  homebrew-tap:
    needs: [release-please, build-dmg, upload-dmg]
    # Enabled once the repo is public: repo variable HOMEBREW_TAP_ENABLED=true.
    # Writes to deki-lab/homebrew-tap as the deki-lab GitHub App installed on that repo only
    # (Contents: read and write): org variable HOMEBREW_TAP_CLIENT_ID, org secret HOMEBREW_TAP_APP_KEY.
    if: >-
      needs.release-please.outputs.release_created == 'true' &&
      needs.upload-dmg.result == 'success' &&
      vars.HOMEBREW_TAP_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A one-hour token, limited to the tap and to its contents.
      - id: tap-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HOMEBREW_TAP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_KEY }}
          owner: deki-lab
          repositories: homebrew-tap
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: deki-lab/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: tap
      - env:
          VERSION: ${{ needs.release-please.outputs.version }}
          SHA256: ${{ needs.build-dmg.outputs.sha256 }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid version: $VERSION" >&2; exit 1; }
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid sha256: $SHA256" >&2; exit 1; }
          mkdir -p tap/Casks
          sed -e "s/__VERSION__/$VERSION/" -e "s/__SHA256__/$SHA256/" \
              packaging/kubeport.rb.tmpl > tap/Casks/kubeport.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/kubeport.rb
          git commit -m "kubeport $VERSION"
          # Other apps' releases write to the same tap: replay on top of theirs.
          git pull --rebase --quiet
          git push

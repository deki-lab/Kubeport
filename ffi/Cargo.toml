[package]
name = "kubeport-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# staticlib: linked into the SwiftUI app; cdylib: read by uniffi-bindgen to generate the Swift code.
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
kubeport-core = { path = "../core" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "sync", "time"] }
tracing = "0.1.44"
uniffi = { version = "0.32.2", features = ["cli"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }

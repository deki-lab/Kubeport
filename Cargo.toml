[workspace]
resolver = "3"
members = ["core", "cli", "ffi"]

[workspace.package]
# The app version lives in version.txt (managed by release-please).
# Internal crates are not published: their version stays frozen.
version = "0.0.0"
edition = "2024"
publish = false

[profile.release]
# Minimal memory footprint and binary size (ADR-0003).
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

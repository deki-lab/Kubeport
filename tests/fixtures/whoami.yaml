# Cible de test : 2 replicas, port nommé `http`, Service sur un port différent.
apiVersion: v1
kind: Namespace
metadata:
  name: kubeport-it
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: kubeport-it
spec:
  replicas: 2
  selector:
    matchLabels: { app: whoami }
  template:
    metadata:
      labels: { app: whoami }
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: whoami
          image: traefik/whoami:v1.11
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 1
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: kubeport-it
spec:
  selector: { app: whoami }
  ports:
    - port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: external
  namespace: kubeport-it
spec:
  type: ExternalName
  externalName: example.com
